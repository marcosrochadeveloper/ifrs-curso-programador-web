<html>
    <head>
        <title>Imagens</title>
    </head>
    <body>
        <header>
            <h1>Curso de HTML</h1>
        </header>

        <nav></nav>

        <!--
            <img> tem:
            src: caminho da imagem
            title: texto que aparece quando o mouse passa por cima da imagem
            alt: texto alternativo que aparece caso a imagem não carregue
            height: altura da imagem
            width: largura da imagem
        -->

        <section>
            <img src="esquilo.jpg" title="Foto de um Esquilo" alt="Foto de um Esquilo" height="150px">
        </section>

        <footer></footer>
    </body>
</html>
