<html lang="pt-BR">
    <head>
        <title>Tabelas</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <header>
            <h1>Tabelas</h1>
        </header>
        <nav></nav>
        <section>
            <table border="1">
                <tr>
                    <td>Coluna 1, Linha 1</td>
                    <td rowspan="2">Coluna 2</td>
                </tr>
                <tr>
                    <td>Coluna 1, Linha 2</td>
                </tr>
                <tr>
                    <td colspan="2">Linha 3</td>
                </tr>
            </table>

            <table>
                <thead></thead>
                    <tr>
                        <th>Mês</th>
                        <th>Valor</th>
                    </tr>
                </thead>
                <!-- O <tfoot> é usado para definir o rodapé da tabela.
                    Ele pode ser colocado em qualquer lugar,
                    mas será exibido SOMENTE no final da tabela.
                -->
                <tfoot>
                    <tr>
                        <td>Total</td>
                        <td>R$ 180,00</td>
                    </tr>
                </tfoot>

                <tbody>
                    <tr>
                        <td>Janeiro</td>
                        <td>R$100,00</td>
                    </tr>
                    <tr>
                        <td>Fevereiro</td>
                        <td>R$80,00</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </body>

</html>
