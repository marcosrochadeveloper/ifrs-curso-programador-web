<html>
    <head>
        <title>Novas Funcionalidades</title>
    </head>
    <body>
        <header>
            <h1>Curso de HTML</h1>
        </header>

        <nav></nav>

        <section>

            <!--
            <details> tem:
                <summary>Resumo</summary>
                Conteúdo detalhado que pode ser expandido ou recolhido.
            -->

            <details>
                <summary style="cursor: pointer;">HTML</summary>
                Esta é uma funcionalidade nova.
            </details>


            <!--
                <meter> é uma barra de progresso que indica um valor dentro de um intervalo conhecido.
                <meter> tem:
                    min: valor mínimo (padrão é 0)
                    max: valor máximo (padrão é 1)
                    low: valor abaixo do qual o desempenho é considerado baixo
                    high: valor acima do qual o desempenho é considerado alto
                    optimum: valor ideal
                    value: valor atual
            -->

            <meter
            min="0" max="100"
            low="40" high="90"
            optimum="100"
            value="91"></meter><br><br>
            
            <!--
                <progress> é uma barra de progresso que indica o progresso de uma tarefa em andamento.
                <progress> tem:
                    value: valor atual
                    max: valor máximo (padrão é 1)

            -->
            Carregando...<br>
            <progress></progress>

        </section>

        <footer></footer>
    </body>
</html>
